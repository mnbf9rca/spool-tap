[env:cores3]
platform = espressif32@7.1.3
board = m5stack-cores3
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@4.20017.260907
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -I.pio-local
    -DUSING_UNIT_NFC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.25
    https://github.com/m5stack/M5Unit-NFC.git#63c4caac1a07018ef73027e4b098d4fefe56c6f6

[env:cores3_test]
extends = env:cores3
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_speed = 115200
build_flags =
    ${env:cores3.build_flags}
    -DSPOOL_TAP_UNIT_TEST

[env:cores3_capture]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DSPOOL_TAP_CAPTURE_NDEF
